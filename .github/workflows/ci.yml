name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # next.config menolak SITE_URL kosong, termasuk saat `next typegen` di typecheck.
    env:
      SITE_URL: https://fyas.web.id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # package-lock.json ditulis npm 11.6; npm bawaan runner menolaknya saat `npm ci`.
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Build juga menjalankan validate:content (skema frontmatter dan gambar di public/).
      - run: npm run build
